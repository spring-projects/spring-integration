name: CI SNAPSHOT

on:
  workflow_dispatch:
    inputs:
      gradleOptions:
        description: 'The Gradle CLI options: tasks, properties etc.'
        required: false
        type: string

  push:
    branches:
      - main
      - '*.x'
      - '*.x-internal'
    paths-ignore:
      - '.github/dependabot.yml'

  schedule:
    - cron: '0 5 * * *'

concurrency:
  group: group-snapshot-for-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-snapshot:
    uses: spring-io/spring-github-workflows/.github/workflows/spring-artifactory-gradle-snapshot.yml@main
    with:
      gradleTasks: ${{ github.event_name == 'schedule' && '--rerun-tasks --refresh-dependencies' || inputs.gradleOptions }}
      artifactoryUrl: ${{ vars.COMMERCIAL && 'https://usw1.packages.broadcom.com' }}
      targetRepository: ${{ vars.COMMERCIAL && 'spring-enterprise-maven-dev-local' }}
      artifactoryProjectKey: ${{ vars.COMMERCIAL && 'spring' }}
      runner: ${{ vars.COMMERCIAL && 'ubuntu22-2-8' || 'ubuntu-latest' }}
    secrets:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
      ARTIFACTORY_USERNAME: ${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME || secrets.ARTIFACTORY_USERNAME }}
      ARTIFACTORY_PASSWORD: ${{ secrets.COMMERCIAL_ARTIFACTORY_PASSWORD || secrets.ARTIFACTORY_PASSWORD }}
